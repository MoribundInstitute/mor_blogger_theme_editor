[workspace]
members = [
    "mor_blogger_core",
    "mor_blogger_dioxus_ui",
    "mor_blogger_cli"
]
resolver = "2"
default-members = ["mor_blogger_dioxus_ui"]
[workspace.dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.11", features = ["json"] }
zip = "0.6.3"