# Moribund round-trip fixture — preserve this comment verbatim.
[site]
site_title = "Quest Board Ω"
site_subtitle = "Guild notices • trading post 🛡️"
header_logo_url = "https://example.test/logo.png"
home_url = "https://example.test/"

[colors]
bg_base = "#24170f"
fg_base = "#e7dcc0"
fg_muted = "#b8a88d"
accent = "#ffae42"
border = "#22160f"
panel_border_width = "2px"
glow_spread = "12px"
hover_scale = "1.04"

[colors.bg_panel]
mode = "Solid"
color = "#4f3b2a"

[colors.bg_elevated]
mode = "Solid"
color = "#5e4732"

[background.mode.Gradient]
from = "#362317"
to = "#1b120d"
angle_deg = 180

[typography]
body_font_stack = "Georgia, 'Times New Roman', Times, serif"
heading_font_stack = "Georgia, 'Times New Roman', Times, serif"
mono_font_stack = "'Courier New', Courier, monospace"
base_size = "17px"
scale_ratio = "1.25"
line_height = "1.55"
heading_weight = "700"

[buttons]
radius = "2px"
border_width = "2px"
text_transform = "uppercase"

[template_pack]
header_variant = "gtk_headerbar"
main_variant = "two_column_right"
content_variant = "magazine_grid"
left_sidebar_variant = "gtk_dock_left"
right_sidebar_variant = "toc_right"
footer_variant = "mega"
script_variant = "mor_collapsible_sidebars"

[[menu_links]]
label = "Quest Board"
url = "/"

[[menu_links]]
label = "Trading Post"
url = "/p/trading-post.html"

[footer]
footer_text = "© Guild Registry — byte-perfect restore probe"

preset_css = '''
/* preset bytes 🎮 */
body { letter-spacing: 0.5px; }
.mor-panel { border-style: double; }
'''

active_preset_id = "mor_retro_mmorpg"