[package]
name = "mor_blogger_dioxus_ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dependencies]
# Link to local backend engine
mor_blogger_core = { path = "../mor_blogger_core" }

dioxus = "0.7"
dioxus-logger = "0.5.1"
rfd = "0.17.2"
image = "0.24"

log.workspace = true
serde.workspace = true
serde_json = "1.0"
toml.workspace = true
reqwest.workspace = true
zip.workspace = true

# Native desktop runtime (clipboard, file watching, async).
arboard = "3.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = "6.1"
tokio = { version = "1.0", features = ["sync"] }

# Sets the GTK program name so Wayland reports a stable app_id for the .desktop
# icon mapping. Pinned to the version already pulled in transitively via gtk/tao.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"