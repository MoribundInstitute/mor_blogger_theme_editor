[package]
name = "mor_blogger_dioxus_ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[dependencies]
# Link to local backend engine
mor_blogger_core = { path = "../mor_blogger_core" }

dioxus = "0.7"
dioxus-logger = "0.5.1"
rfd = "0.17.2"
syntect = "5.2"

log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
zip.workspace = true

# Native Desktop Clipboard (Linux/Mac/Windows)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = "6.1"

# Browser-only WebAssembly dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Navigator",
    "Clipboard",
    "console"
]