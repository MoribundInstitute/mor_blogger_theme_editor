name = "Mor Fluid Interactive"
description = "Readable liquid-motion UI: luminous panels, gentle hover physics, and dashboard-friendly surfaces."

preset_css = '''
/* ============================================================
   Mor Fluid Interactive Preset
   ============================================================ */

body::before {
  background: none !important;
  opacity: 0 !important;
}

html, body {
  background-color: var(--bg-base) !important;
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--accent) 34%, transparent) 0, transparent 32rem),
    radial-gradient(circle at 82% 12%, color-mix(in srgb, var(--border-color) 32%, var(--accent)) 0, transparent 30rem),
    radial-gradient(circle at 48% 92%, color-mix(in srgb, var(--bg-panel) 28%, var(--accent)) 0, transparent 34rem),
    linear-gradient(
      145deg,
      color-mix(in srgb, var(--bg-base) 94%, var(--accent)) 0%,
      var(--bg-base) 45%,
      color-mix(in srgb, var(--bg-base) 88%, var(--border-color)) 100%
    ) !important;
  background-size: 145% 145%, 135% 135%, 160% 160%, 100% 100% !important;
  background-position: 0% 0%, 100% 0%, 50% 100%, center !important;
  background-attachment: fixed !important;
  animation: mor-fluid-background-drift 28s ease-in-out infinite alternate;
}

@keyframes mor-fluid-background-drift {
  from { background-position: 0% 0%, 100% 0%, 50% 100%, center; }
  to { background-position: 22% 10%, 78% 18%, 38% 82%, center; }
}

.canvas-core, .mor-post, .mor-panel, .main-header, .mor-footer, .mor-catalog-dropdown {
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--bg-panel) 88%, var(--fg-base)) 0%,
    color-mix(in srgb, var(--bg-panel) 90%, var(--bg-base)) 100%
  ) !important;
  border: 1px solid color-mix(in srgb, var(--border-color) 78%, transparent) !important;
  border-radius: 8px !important;
  box-shadow:
    0 1px 0 color-mix(in srgb, var(--fg-base) 12%, transparent) inset,
    0 16px 42px color-mix(in srgb, var(--bg-base) 22%, transparent) !important;
}

.main-header {
  position: relative !important;
  overflow: hidden !important;
  margin-bottom: 18px !important;
}

.main-header::after {
  content: "";
  position: absolute;
  left: 1rem;
  right: 1rem;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 76%, transparent), transparent);
  pointer-events: none;
}

.mor-nav > a:hover, .mor-nav button:hover {
  color: var(--accent) !important;
  background: color-mix(in srgb, var(--accent) 12%, transparent) !important;
  transform: translateY(-1px);
}

.mor-post {
  padding: clamp(1.1rem, 2.5vw, 1.75rem) !important;
  margin-bottom: 1rem !important;
  transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), border-color 220ms ease, box-shadow 220ms ease !important;
}

.mor-post:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border-color)) !important;
  box-shadow:
    0 1px 0 color-mix(in srgb, var(--fg-base) 14%, transparent) inset,
    0 22px 56px color-mix(in srgb, var(--bg-base) 26%, transparent),
    0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent) !important;
}

.mor-post .post-title::after {
  content: "";
  display: block;
  width: min(8rem, 45%);
  height: 2px;
  margin-top: 0.55rem;
  background: linear-gradient(90deg, var(--accent), transparent);
}
input[type='text']:focus, textarea:focus {
  outline: none !important;
  border-color: var(--accent) !important;
  box-shadow:
    0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent),
    0 1px 0 color-mix(in srgb, var(--fg-base) 12%, transparent) inset !important;
}

/* --- Theme cursors (default / pointer / text) --- */
body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M1 1L1 17L5 13L8 19L11 18L8 12L14 12Z' fill='%2305a581' stroke='%2306231d' stroke-width='1'/></svg>") 1 1, auto !important; }
a, button { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 2.2c-.7 0-1.3.6-1.3 1.3v6.5H6.9c-.6 0-1.1.3-1.4.8-.3.5-.2 1.1.1 1.6l2.2 3.1c.5.7 1.3 1.1 2.1 1.1h3.4c1 0 1.9-.7 2.1-1.7l.7-3.2c.2-.9-.3-1.8-1.2-2-.2 0-.3-.1-.5-.1h-2.8V3.5c0-.7-.6-1.3-1.3-1.3z' fill='%2305a581' stroke='%2306231d' stroke-width='1'/></svg>") 9 2, pointer !important; }
input, textarea { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 3h6M12 3v18M9 21h6' fill='none' stroke='%2305a581' stroke-width='1.6'/></svg>") 12 12, text !important; }
'''

[colors]
bg_base = "#080d12"
fg_base = "#edf7f3"
fg_muted = "#9fb8b0"
accent = "#05a581"
border = "#27423d"
panel_border_width = "1px"
glow_spread = "15px"
hover_scale = "1.015"

[colors.bg_panel]
mode = "Solid"
color = "#101923"
gradient_from = "#101923"
gradient_to = "#101923"
gradient_angle_deg = 180

[colors.bg_elevated]
mode = "Solid"
color = "#172635"
gradient_from = "#172635"
gradient_to = "#172635"
gradient_angle_deg = 180

[background.mode.Solid]
color = "#080d12"

[typography]
body_font_stack = "system-ui, -apple-system, sans-serif"
heading_font_stack = "system-ui, -apple-system, sans-serif"
mono_font_stack = "'Courier New', Courier, monospace"
base_size = "16px"
scale_ratio = "1.22"
line_height = "1.65"
heading_weight = "700"

[buttons]
radius = "8px"
border_width = "1px"
text_transform = "none"
padding_x = "0.9rem"
padding_y = "0.55rem"
font_weight = "650"
fill = "gradient"
gradient_from = "color-mix(in srgb, var(--bg-panel) 82%, var(--fg-base))"
gradient_to = "color-mix(in srgb, var(--bg-panel) 86%, var(--bg-base))"
gradient_angle = "180deg"
box_shadow = "0 1px 0 color-mix(in srgb, var(--fg-base) 12%, transparent) inset, 0 8px 22px color-mix(in srgb, var(--bg-base) 14%, transparent)"
hover_effect = "lift"
transition_ms = "160ms"

[light.colors]
bg_base = "#f0f5f9"
fg_base = "#0b1118"
fg_muted = "#566a78"
accent = "#05a581"
border = "#a8c0d0"
panel_border_width = "1px"
glow_spread = "15px"
hover_scale = "1.015"

[light.colors.bg_panel]
mode = "Solid"
color = "#ffffff"
gradient_from = "#ffffff"
gradient_to = "#ffffff"
gradient_angle_deg = 180

[light.colors.bg_elevated]
mode = "Solid"
color = "#f4f8fc"
gradient_from = "#f4f8fc"
gradient_to = "#f4f8fc"
gradient_angle_deg = 180

[light.background.mode.Solid]
color = "#f0f5f9"

[scrollbars]
width = "10px"
track_color = "#101923"
thumb_color = "#05a581"
thumb_hover_color = "#2fd0a8"
