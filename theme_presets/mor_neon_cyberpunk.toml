name = "Neon Cyberpunk"
description = "Near-black phosphor under hot-pink and cyan glow: scanlines, chromatic-aberration headings, terminal type. A CRT readout from a 1995 prediction of 2025. Light mode trades the tube for a printed-circuit daylight look - silkscreen white, teal ink, copper-trace accents."

preset_css = '''
/* ============================================================
   Neon Cyberpunk preset
   Dark: a CRT readout from a 1995 prediction of 2025 -
   near-black tube, hot-pink / cyan phosphor bloom, scanlines,
   chromatic-aberration headings, terminal typefaces.
   Light: printed-circuit daylight - silkscreen white board,
   teal ink, faint trace grid; the same signals, powered down.
   Glow lives on headings, accents and hover states only;
   body copy stays clean for readability.
   ============================================================ */

/* --- Signal palette (light mode re-tunes every glow) --- */
:root {
  --nc-pink: var(--accent);
  --nc-cyan: #00e5ff;
  --nc-pink-glow: rgba(255, 43, 214, 0.45);
  --nc-cyan-glow: rgba(0, 229, 255, 0.40);
  --nc-scanline: rgba(0, 229, 255, 0.045);
  --nc-grid: transparent;
}

html[data-theme="light"] {
  --nc-cyan: #0e7490;
  --nc-pink-glow: rgba(194, 7, 127, 0.16);
  --nc-cyan-glow: rgba(14, 116, 144, 0.14);
  --nc-scanline: transparent;
  --nc-grid: rgba(14, 116, 144, 0.08);
}

/* --- CRT overlay: scanlines in dark, PCB trace grid in light --- */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background:
    repeating-linear-gradient(0deg, transparent 0 2px, var(--nc-scanline) 2px 3px),
    linear-gradient(var(--nc-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--nc-grid) 1px, transparent 1px);
  background-size: auto, 28px 28px, 28px 28px;
}

/* --- Selection reads like an inverted terminal cell --- */
::selection {
  background: var(--nc-pink);
  color: var(--bg-base);
  text-shadow: none;
}

/* --- Surfaces: hard corners, thin border, magenta bloom --- */
.canvas-core,
.mor-post,
.mor-panel,
.main-header,
.mor-footer,
.mor-catalog-dropdown {
  background: var(--bg-panel);
  border: var(--panel-border-width) solid var(--border-color);
  border-radius: 0;
  box-shadow:
    0 0 0 1px var(--nc-pink-glow),
    0 0 18px var(--nc-pink-glow),
    inset 0 0 26px color-mix(in srgb, var(--accent) 6%, transparent);
}

.mor-post {
  position: relative;
  padding: 22px;
  margin: 16px 0;
  transition: box-shadow 220ms ease, border-color 220ms ease;
}

/* Signature: a pink-to-cyan energized strip along each post's top edge */
.mor-post::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--nc-pink), var(--nc-cyan));
  opacity: 0.85;
  pointer-events: none;
}

/* Hover flips the bloom from pink to cyan */
.mor-post:hover {
  border-color: var(--nc-cyan);
  box-shadow:
    0 0 0 1px var(--nc-cyan-glow),
    0 0 22px var(--nc-cyan-glow),
    inset 0 0 30px color-mix(in srgb, var(--nc-cyan) 8%, transparent);
}

.hero-post {
  border-color: var(--nc-cyan);
  box-shadow:
    0 0 0 1px var(--nc-cyan-glow),
    0 0 24px var(--nc-cyan-glow),
    0 0 18px var(--nc-pink-glow),
    inset 0 0 30px color-mix(in srgb, var(--accent) 7%, transparent);
}

/* --- Headings: chromatic aberration, no glow on body copy --- */
.post-title,
.entry-title,
.post-title a,
.entry-title a,
.mor-panel-heading,
.panel-header {
  color: var(--fg-base);
  letter-spacing: 0.05em;
  text-shadow:
    -1.5px 0 0 var(--nc-pink-glow),
    1.5px 0 0 var(--nc-cyan-glow),
    0 0 10px var(--nc-cyan-glow);
}

.mor-post h1,
.mor-post h2,
.mor-post h3,
.mor-post h4 {
  letter-spacing: 0.04em;
  text-shadow:
    -1px 0 0 var(--nc-pink-glow),
    1px 0 0 var(--nc-cyan-glow);
}

.post-body,
.panel-content {
  text-shadow: none;
}

/* --- Masthead: tracked-out marquee with an occasional flicker --- */
.branding .institute-title,
.search-centered .institute-title {
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-shadow:
    -1.5px 0 0 var(--nc-pink-glow),
    1.5px 0 0 var(--nc-cyan-glow),
    0 0 14px var(--nc-pink-glow);
  animation: nc-flicker 7s linear infinite;
}

@keyframes nc-flicker {
  0%, 93%, 100% { opacity: 1; }
  94% { opacity: 0.72; }
  95% { opacity: 0.98; }
  96.5% { opacity: 0.85; }
  97% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .branding .institute-title,
  .search-centered .institute-title {
    animation: none;
  }
}

/* --- Links: cyan data-lines; hover fills like a selected cell --- */
.post-body a,
.panel-content a,
.footer-col a {
  color: var(--nc-cyan);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--nc-cyan) 45%, transparent);
  transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
}

.post-body a:hover,
.post-body a:focus-visible,
.panel-content a:hover,
.panel-content a:focus-visible,
.footer-col a:hover,
.footer-col a:focus-visible {
  color: var(--bg-base);
  background: var(--nc-cyan);
  border-bottom-color: var(--nc-cyan);
  text-shadow: none;
  box-shadow: 0 0 12px var(--nc-cyan-glow);
}

/* --- Meta lines: tiny uppercase telemetry --- */
.post-meta,
.byline,
.sys-date,
.footer-sys-info {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--fg-muted);
}

/* --- Labels read like array indices: [ tag ] --- */
.post-labels a,
.sys-tags a {
  color: var(--fg-muted);
  border-bottom: none;
}

.post-labels a::before,
.sys-tags a::before { content: "[ "; color: var(--nc-pink); }

.post-labels a::after,
.sys-tags a::after { content: " ]"; color: var(--nc-pink); }

.post-labels a:hover,
.sys-tags a:hover {
  color: var(--nc-pink);
  background: transparent;
  text-shadow: 0 0 8px var(--nc-pink-glow);
}

/* --- Blockquote: transmission excerpt --- */
.post-body blockquote {
  margin: 1.4em 0;
  padding: 0.9em 1.2em;
  border-left: 2px solid var(--nc-pink);
  background: color-mix(in srgb, var(--accent) 7%, transparent);
  color: var(--fg-base);
}

/* --- Code: raw feed on an elevated slab --- */
.post-body code,
.post-body kbd {
  color: var(--nc-cyan);
  background: var(--bg-elevated);
  border: 1px solid color-mix(in srgb, var(--nc-cyan) 25%, transparent);
  padding: 0.1em 0.4em;
  font-size: 0.9em;
}

.post-body pre {
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  box-shadow: inset 0 0 20px color-mix(in srgb, var(--nc-cyan) 5%, transparent);
  padding: 1em 1.2em;
  overflow-x: auto;
}

.post-body pre code {
  background: none;
  border: none;
  padding: 0;
}

/* --- Dividers: a signal sweep --- */
hr {
  border: none;
  height: 1px;
  margin: 1.8em 0;
  background: linear-gradient(90deg, transparent, var(--nc-pink), var(--nc-cyan), transparent);
  box-shadow: 0 0 8px var(--nc-pink-glow);
}

/* --- Images: slightly overdriven phosphor --- */
.post-thumbnail,
.post-body img {
  border: 1px solid var(--border-color);
  filter: saturate(1.12) contrast(1.04);
}

/* --- Panel chrome & footer console --- */
.mor-panel-heading,
.panel-header {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 0.82rem;
}

.mor-footer {
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.footer-copyright,
.footer-sys-info {
  font-family: var(--font-mono);
}

/* --- Theme cursors (default / pointer / text) --- */
body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M1 1L1 17L5 13L8 19L11 18L8 12L14 12Z' fill='%23000000' stroke='%2300e5ff' stroke-width='1.4'/></svg>") 1 1, auto !important; }
a, button { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M12 3v5M12 16v5M3 12h5M16 12h5' fill='none' stroke='%23ff2bd6' stroke-width='1.6'/><circle cx='12' cy='12' r='3' fill='none' stroke='%23ff2bd6' stroke-width='1.4'/><circle cx='12' cy='12' r='1.3' fill='%2300e5ff'/></svg>") 12 12, pointer !important; }
input, textarea { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 3h6M12 3v18M9 21h6' fill='none' stroke='%2300e5ff' stroke-width='1.6'/></svg>") 12 12, text !important; }
'''

# --- Base config (dark is the native mode) ---

[colors]
bg_base = "#030008"
fg_base = "#e8faff"
fg_muted = "#7fd8ea"
accent = "#ff2bd6"
border = "#8f1f9e"
glow_color = "#ff2bd6"
panel_border_width = "1px"
glow_spread = "12px"
glow_intensity = "3"
hover_scale = "1.02"

[colors.bg_panel]
mode = "Gradient"
color = "#0c0518"
gradient_from = "#100722"
gradient_to = "#070210"
gradient_angle_deg = 165

[colors.bg_elevated]
mode = "Solid"
color = "#150a26"

[background.mode.Gradient]
from = "#060013"
to = "#02000a"
angle_deg = 180

[typography]
body_font_stack = "'JetBrains Mono', monospace"
heading_font_stack = "'Orbitron', sans-serif"
mono_font_stack = "'Fira Code', monospace"
base_size = "15px"
scale_ratio = "1.25"
line_height = "1.65"
heading_weight = "700"

[buttons]
radius = "0px"
border_width = "1px"
text_transform = "uppercase"
letter_spacing = "0.14em"
font_size = "0.82rem"
font_weight = "600"
padding_x = "14px"
padding_y = "7px"
fill = "neon"
glow_color = "#ff2bd6"
glow_strength = "10px"
hover_effect = "glow"
transition_ms = "160ms"
easing = "cubic-bezier(0.2, 0.8, 0.2, 1)"
pressed_feedback = true
focus_ring_color = "#00e5ff"

# --- Dark palette: the tube, powered on ---

[dark.colors]
bg_base = "#030008"
fg_base = "#e8faff"
fg_muted = "#7fd8ea"
accent = "#ff2bd6"
border = "#8f1f9e"
glow_color = "#ff2bd6"
panel_border_width = "1px"
glow_spread = "12px"
glow_intensity = "3"
hover_scale = "1.02"

[dark.colors.bg_panel]
mode = "Gradient"
color = "#0c0518"
gradient_from = "#100722"
gradient_to = "#070210"
gradient_angle_deg = 165

[dark.colors.bg_elevated]
mode = "Solid"
color = "#150a26"

[dark.background.mode.Gradient]
from = "#060013"
to = "#02000a"
angle_deg = 180

# --- Light palette: printed-circuit daylight ---
# Silkscreen-white board, teal ink, magenta test-points; glows are
# re-tuned in preset_css to faint trace shadows, and the scanline
# overlay swaps for a PCB grid.

[light.colors]
bg_base = "#e9f2f4"
fg_base = "#0b2530"
fg_muted = "#3d6b7a"
accent = "#c2077f"
border = "#0e8a9e"
glow_color = "#c2077f"
panel_border_width = "1px"
glow_spread = "6px"
glow_intensity = "1"
hover_scale = "1.02"

[light.colors.bg_panel]
mode = "Gradient"
color = "#fbfeff"
gradient_from = "#ffffff"
gradient_to = "#eef7f8"
gradient_angle_deg = 165

[light.colors.bg_elevated]
mode = "Solid"
color = "#dcebee"

[light.background.mode.Gradient]
from = "#eef6f7"
to = "#dfeced"
angle_deg = 180

[scrollbars]
width = "10px"
track_color = "#05010d"
thumb_color = "#ff2bd6"
thumb_hover_color = "#00e5ff"
