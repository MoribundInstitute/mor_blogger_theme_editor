name = "Neon Cyberpunk"
description = "Pure black backgrounds, hot pink and cyan glows, scanline overlay, monospace everything. Designed to look like a CRT readout from a 1995 prediction of 2025."

preset_css = '''
/* ============================================================
   Neon Cyberpunk preset
   Pure black backgrounds, hot pink and cyan glows, scanline
   overlay, monospace everything. Designed to look like a CRT
   readout from a 1995 prediction of 2025.
   ============================================================ */

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    transparent 0,
    transparent 2px,
    rgba(0, 255, 255, 0.05) 2px,
    rgba(0, 255, 255, 0.05) 3px
  );
}

.mor-post .post-title,
.mor-post .post-title a,
.main-header .institute-title,
.mor-panel-heading,
.panel-header {
  color: var(--fg-base);
  text-shadow:
    0 0 4px var(--fg-base),
    0 0 8px var(--accent),
    -1px 0 0 rgba(255, 0, 255, 0.55),
    1px 0 0 rgba(0, 255, 255, 0.55);
  letter-spacing: 0.04em;
}

.canvas-core,
.mor-post,
.mor-panel,
.main-header,
.mor-footer,
.mor-catalog-dropdown {
  background: var(--bg-panel);
  border: 1px solid var(--accent);
  border-radius: 0;
  box-shadow:
    0 0 0 1px rgba(255, 0, 255, 0.35),
    0 0 14px rgba(255, 0, 255, 0.45),
    inset 0 0 22px rgba(255, 0, 255, 0.08);
}

.mor-post {
  padding: 20px;
  margin: 14px 0;
  transition: box-shadow 240ms ease, border-color 240ms ease;
}

.mor-post:hover {
  border-color: var(--fg-base);
  box-shadow:
    0 0 0 1px rgba(0, 255, 255, 0.45),
    0 0 22px rgba(0, 255, 255, 0.55),
    inset 0 0 32px rgba(0, 255, 255, 0.12);
}

.pager-btn,
.panel-toggle,
.toc-jump-link,
.back-to-top-btn,
.mor-catalog-trigger {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 0;
  padding: 6px 14px;
  font-family: var(--font-mono, monospace);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  box-shadow:
    0 0 6px rgba(255, 0, 255, 0.4),
    inset 0 0 6px rgba(255, 0, 255, 0.2);
  text-shadow: 0 0 4px var(--accent);
  cursor: pointer;
  transition: all 180ms ease;
}

.pager-btn:hover,
.panel-toggle:hover,
.toc-jump-link:hover,
.back-to-top-btn:hover,
.mor-catalog-trigger:hover {
  background: var(--accent);
  color: var(--bg-base);
  text-shadow: none;
  box-shadow:
    0 0 14px var(--accent),
    0 0 24px var(--accent);
}

.mor-post .post-body a,
.panel-content a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px dotted var(--accent);
  text-shadow: 0 0 4px var(--accent);
  transition: color 180ms ease, text-shadow 180ms ease;
}

.mor-post .post-body a:hover {
  color: var(--fg-base);
  border-bottom-color: var(--fg-base);
  text-shadow: 0 0 8px var(--fg-base);
}

.main-header .institute-title {
  font-size: 1.6rem;
  letter-spacing: 0.18em;
  font-weight: 700;
}

.prompt {
  color: var(--fg-base);
  text-shadow: 0 0 6px var(--fg-base);
  animation: neon-prompt-blink 1.1s steps(2, end) infinite;
}

@keyframes neon-prompt-blink {
  50% { opacity: 0.35; }
}

.mor-post h1,
.mor-post h2,
.mor-post h3 {
  color: var(--fg-base);
  text-shadow:
    0 0 3px var(--fg-base),
    -1px 0 0 rgba(255, 0, 255, 0.45),
    1px 0 0 rgba(0, 255, 255, 0.45);
  letter-spacing: 0.03em;
}

.mor-post .post-body {
  color: var(--fg-muted);
  text-shadow: none;
}

.mor-footer {
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 18px;
}

/* --- Theme cursors (default / pointer / text) --- */
body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M1 1L1 17L5 13L8 19L11 18L8 12L14 12Z' fill='%23000000' stroke='%2300eaff' stroke-width='1.4'/></svg>") 1 1, auto !important; }
a, button { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M12 3v5M12 16v5M3 12h5M16 12h5' fill='none' stroke='%23ff2bd6' stroke-width='1.6'/><circle cx='12' cy='12' r='3' fill='none' stroke='%23ff2bd6' stroke-width='1.4'/><circle cx='12' cy='12' r='1.3' fill='%2300eaff'/></svg>") 12 12, pointer !important; }
input, textarea { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 3h6M12 3v18M9 21h6' fill='none' stroke='%2300eaff' stroke-width='1.6'/></svg>") 12 12, text !important; }
'''

[colors]
bg_base = "#05010f"
fg_base = "#00ffff"
fg_muted = "#6ee7ff"
accent = "#ff00ff"
border = "#ff00ff"
panel_border_width = "1px"
glow_spread = "14px"
hover_scale = "1.02"

[colors.bg_panel]
mode = "Solid"
color = "#0a0418"

[colors.bg_elevated]
mode = "Solid"
color = "#120828"

[background.mode.Solid]
color = "#05010f"

[typography]
body_font_stack = "'Courier New', Courier, monospace"
heading_font_stack = "'Courier New', Courier, monospace"
mono_font_stack = "'Courier New', Courier, monospace"
base_size = "15px"
scale_ratio = "1.2"
line_height = "1.55"
heading_weight = "700"

[buttons]
radius = "0px"
border_width = "1px"
text_transform = "uppercase"

[light.colors]
bg_base = "#f0f0f5"
fg_base = "#05010f"
fg_muted = "#4a4a70"
accent = "#cc00cc"
border = "#00a0a0"

[light.colors.bg_panel]
mode = "Solid"
color = "#e0e0e8"

[light.colors.bg_elevated]
mode = "Solid"
color = "#d0d0e0"

[light.background.mode.Solid]
color = "#f0f0f5"

[scrollbars]
width = "8px"
track_color = "#0a0a0a"
thumb_color = "#ff2bd6"
thumb_hover_color = "#00eaff"
