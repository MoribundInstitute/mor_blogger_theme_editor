name = "Mor Neon Cyberpunk"
description = "Near-black phosphor under a two-tone glow: scanlines, chromatic-aberration headings, terminal type. A CRT readout from a 1995 prediction of 2025. Light mode trades the tube for printed-circuit daylight. Phosphor pairs: pink/cyan, acid/cyan, cyan/pink, amber/red."

preset_css = '''
/* ============================================================
   Mor Neon Cyberpunk preset
   Dark: a CRT readout from a 1995 prediction of 2025 -
   near-black tube, hot-pink / cyan phosphor bloom, scanlines,
   chromatic-aberration headings, terminal typefaces.
   Light: printed-circuit daylight - silkscreen white board,
   teal ink, faint trace grid; the same signals, powered down.
   Glow lives on headings, accents and hover states only;
   body copy stays clean for readability.
   ============================================================ */

/* --- Signal palette: primary phosphor = --accent, secondary = --glow-color
   (both palette-driven, so every color scheme keeps a true two-tone pair;
   light mode only turns the bloom down) --- */
:root {
  --nc-pink: var(--accent);
  --nc-cyan: var(--glow-color, #00e5ff);
  --nc-pink-glow: color-mix(in srgb, var(--nc-pink) 45%, transparent);
  --nc-cyan-glow: color-mix(in srgb, var(--nc-cyan) 40%, transparent);
  --nc-scanline: color-mix(in srgb, var(--nc-cyan) 4.5%, transparent);
  --nc-grid: transparent;
}

html[data-theme="light"] {
  --nc-pink-glow: color-mix(in srgb, var(--nc-pink) 16%, transparent);
  --nc-cyan-glow: color-mix(in srgb, var(--nc-cyan) 14%, transparent);
  --nc-scanline: transparent;
  --nc-grid: color-mix(in srgb, var(--nc-cyan) 8%, transparent);
}

/* --- CRT overlay: scanlines in dark, PCB trace grid in light --- */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background:
    repeating-linear-gradient(0deg, transparent 0 2px, var(--nc-scanline) 2px 3px),
    linear-gradient(var(--nc-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--nc-grid) 1px, transparent 1px);
  background-size: auto, 28px 28px, 28px 28px;
}

/* --- Selection reads like an inverted terminal cell --- */
::selection {
  background: var(--nc-pink);
  color: var(--bg-base);
  text-shadow: none;
}

/* --- Surfaces: hard corners, thin border, magenta bloom --- */
.canvas-core,
.mor-post,
.mor-panel,
.main-header,
.mor-footer,
.mor-catalog-dropdown {
  background: var(--bg-panel);
  border: var(--panel-border-width) solid var(--border-color);
  border-radius: 0;
  box-shadow:
    0 0 0 1px var(--nc-pink-glow),
    0 0 18px var(--nc-pink-glow),
    inset 0 0 26px color-mix(in srgb, var(--accent) 6%, transparent);
}

.mor-post {
  position: relative;
  padding: 22px;
  margin: 16px 0;
  transition: box-shadow 220ms ease, border-color 220ms ease;
}

/* Signature: a pink-to-cyan energized strip along each post's top edge */
.mor-post::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--nc-pink), var(--nc-cyan));
  opacity: 0.85;
  pointer-events: none;
}

/* Hover deepens the accent bloom (structure never swaps phosphor) */
.mor-post:hover {
  border-color: color-mix(in srgb, var(--accent) 70%, var(--border-color));
  box-shadow:
    0 0 0 1px var(--nc-pink-glow),
    0 0 22px var(--nc-pink-glow),
    inset 0 0 30px color-mix(in srgb, var(--accent) 8%, transparent);
}

.hero-post {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border-color));
  box-shadow:
    0 0 0 1px var(--nc-pink-glow),
    0 0 24px var(--nc-pink-glow),
    0 0 14px var(--nc-cyan-glow),
    inset 0 0 30px color-mix(in srgb, var(--accent) 7%, transparent);
}

/* --- Headings: chromatic aberration, no glow on body copy --- */
.post-title,
.entry-title,
.post-title a,
.entry-title a,
.mor-panel-heading,
.panel-header {
  color: var(--fg-base);
  letter-spacing: 0.05em;
  text-shadow:
    -1.5px 0 0 var(--nc-pink-glow),
    1.5px 0 0 var(--nc-cyan-glow),
    0 0 10px var(--nc-cyan-glow);
}

.mor-post h1,
.mor-post h2,
.mor-post h3,
.mor-post h4 {
  letter-spacing: 0.04em;
  text-shadow:
    -1px 0 0 var(--nc-pink-glow),
    1px 0 0 var(--nc-cyan-glow);
}

.post-body,
.post-body p,
.panel-content {
  color: var(--fg-base);
  text-shadow: none;
}

/* Meta/telemetry always uses the palette's muted ink, not a phosphor. */
.post-meta,
.post-meta a,
.sys-date,
.byline {
  color: var(--fg-muted) !important;
}

/* --- Masthead: tracked-out marquee with an occasional flicker --- */
.branding .institute-title,
.search-centered .institute-title {
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-shadow:
    -1.5px 0 0 var(--nc-pink-glow),
    1.5px 0 0 var(--nc-cyan-glow),
    0 0 14px var(--nc-pink-glow);
  animation: nc-flicker 7s linear infinite;
}

@keyframes nc-flicker {
  0%, 93%, 100% { opacity: 1; }
  94% { opacity: 0.72; }
  95% { opacity: 0.98; }
  96.5% { opacity: 0.85; }
  97% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .branding .institute-title,
  .search-centered .institute-title {
    animation: none;
  }
}

/* --- Links: accent data-lines; hover fills like a selected cell --- */
.post-body a,
.panel-content a,
.footer-col a {
  color: color-mix(in srgb, var(--accent) 78%, var(--fg-base));
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
}

.post-body a:hover,
.post-body a:focus-visible,
.panel-content a:hover,
.panel-content a:focus-visible,
.footer-col a:hover,
.footer-col a:focus-visible {
  color: var(--bg-base);
  background: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: none;
  box-shadow: 0 0 12px var(--nc-pink-glow);
}

/* --- Meta lines: tiny uppercase telemetry --- */
.post-meta,
.byline,
.sys-date,
.footer-sys-info {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--fg-muted);
}

/* --- Labels read like array indices: [ tag ] --- */
.post-labels a,
.sys-tags a {
  color: var(--fg-muted);
  border-bottom: none;
}

.post-labels a::before,
.sys-tags a::before { content: "[ "; color: var(--nc-pink); }

.post-labels a::after,
.sys-tags a::after { content: " ]"; color: var(--nc-pink); }

.post-labels a:hover,
.sys-tags a:hover {
  color: var(--nc-pink);
  background: transparent;
  text-shadow: 0 0 8px var(--nc-pink-glow);
}

/* --- Blockquote: transmission excerpt --- */
.post-body blockquote {
  margin: 1.4em 0;
  padding: 0.9em 1.2em;
  border-left: 2px solid var(--nc-pink);
  background: color-mix(in srgb, var(--accent) 7%, transparent);
  color: var(--fg-base);
}

/* --- Code: raw feed on an elevated slab --- */
.post-body code,
.post-body kbd {
  color: color-mix(in srgb, var(--accent) 72%, var(--fg-base));
  background: var(--bg-elevated);
  border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
  padding: 0.1em 0.4em;
  font-size: 0.9em;
}

.post-body pre {
  background: var(--bg-elevated);
  border: 1px solid var(--border-color);
  box-shadow: inset 0 0 20px color-mix(in srgb, var(--accent) 5%, transparent);
  padding: 1em 1.2em;
  overflow-x: auto;
}

.post-body pre code {
  background: none;
  border: none;
  padding: 0;
}

/* --- Dividers: a signal sweep --- */
hr {
  border: none;
  height: 1px;
  margin: 1.8em 0;
  background: linear-gradient(90deg, transparent, var(--nc-pink), var(--nc-cyan), transparent);
  box-shadow: 0 0 8px var(--nc-pink-glow);
}

/* --- Images: slightly overdriven phosphor --- */
.post-thumbnail,
.post-body img {
  border: 1px solid var(--border-color);
  filter: saturate(1.12) contrast(1.04);
}

/* --- Panel chrome & footer console --- */
.mor-panel-heading,
.panel-header {
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 0.82rem;
}

.mor-footer {
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.footer-copyright,
.footer-sys-info {
  font-family: var(--font-mono);
}

/* --- Theme cursors (default / pointer / text) --- */
body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M1 1L1 17L5 13L8 19L11 18L8 12L14 12Z' fill='%23000000' stroke='{{GLOW_URLENCODED}}' stroke-width='1.4'/></svg>") 1 1, auto !important; }
a, button { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M12 3v5M12 16v5M3 12h5M16 12h5' fill='none' stroke='{{ACCENT_URLENCODED}}' stroke-width='1.6'/><circle cx='12' cy='12' r='3' fill='none' stroke='{{ACCENT_URLENCODED}}' stroke-width='1.4'/><circle cx='12' cy='12' r='1.3' fill='{{GLOW_URLENCODED}}'/></svg>") 12 12, pointer !important; }
input, textarea { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 3h6M12 3v18M9 21h6' fill='none' stroke='{{GLOW_URLENCODED}}' stroke-width='1.6'/></svg>") 12 12, text !important; }
'''

# --- Base config (dark is the native mode) ---

[colors]
bg_base = "#030008"
fg_base = "#e8faff"
fg_muted = "#7fd8ea"
accent = "#ff2bd6"
border = "#8f1f9e"
glow_color = "#00e5ff"
panel_border_width = "1px"
glow_spread = "12px"
glow_intensity = "3"
hover_scale = "1.02"

[colors.bg_panel]
mode = "Gradient"
color = "#0c0518"
gradient_from = "#100722"
gradient_to = "#070210"
gradient_angle_deg = 165

[colors.bg_elevated]
mode = "Solid"
color = "#150a26"

[background.mode.Gradient]
from = "#060013"
to = "#02000a"
angle_deg = 180

[typography]
body_font_stack = "'JetBrains Mono', monospace"
heading_font_stack = "'Orbitron', sans-serif"
mono_font_stack = "'Fira Code', monospace"
base_size = "15px"
scale_ratio = "1.25"
line_height = "1.65"
heading_weight = "700"

[buttons]
radius = "0px"
border_width = "1px"
text_transform = "uppercase"
letter_spacing = "0.14em"
font_size = "0.82rem"
font_weight = "600"
padding_x = "14px"
padding_y = "7px"
fill = "neon"
glow_color = "var(--accent)"
glow_strength = "10px"
hover_effect = "glow"
transition_ms = "160ms"
easing = "cubic-bezier(0.2, 0.8, 0.2, 1)"
pressed_feedback = true
focus_ring_color = "color-mix(in srgb, var(--accent) 60%, white)"

# --- Dark palette: the tube, powered on ---

[dark.colors]
bg_base = "#030008"
fg_base = "#e8faff"
fg_muted = "#7fd8ea"
accent = "#ff2bd6"
border = "#8f1f9e"
glow_color = "#00e5ff"
panel_border_width = "1px"
glow_spread = "12px"
glow_intensity = "3"
hover_scale = "1.02"

[dark.colors.bg_panel]
mode = "Gradient"
color = "#0c0518"
gradient_from = "#100722"
gradient_to = "#070210"
gradient_angle_deg = 165

[dark.colors.bg_elevated]
mode = "Solid"
color = "#150a26"

[dark.background.mode.Gradient]
from = "#060013"
to = "#02000a"
angle_deg = 180

# --- Light palette: printed-circuit daylight ---
# Silkscreen-white board, teal ink, magenta test-points; glows are
# re-tuned in preset_css to faint trace shadows, and the scanline
# overlay swaps for a PCB grid.

[light.colors]
bg_base = "#e9f2f4"
fg_base = "#0b2530"
fg_muted = "#3d6b7a"
accent = "#c2077f"
border = "#0e8a9e"
glow_color = "#0e7490"
panel_border_width = "1px"
glow_spread = "6px"
glow_intensity = "1"
hover_scale = "1.02"

[light.colors.bg_panel]
mode = "Gradient"
color = "#fbfeff"
gradient_from = "#ffffff"
gradient_to = "#eef7f8"
gradient_angle_deg = 165

[light.colors.bg_elevated]
mode = "Solid"
color = "#dcebee"

[light.background.mode.Gradient]
from = "#eef6f7"
to = "#dfeced"
angle_deg = 180

[scrollbars]
width = "10px"
track_color = "color-mix(in srgb, var(--bg-base) 55%, black)"
thumb_color = "var(--accent)"
thumb_hover_color = "color-mix(in srgb, var(--accent) 60%, white)"

# --- Color variants: phosphor pairs (accent = primary, glow_color = secondary),
# each on its own tinted tube so a swap reads as different hardware.

[[variants]]
name = "Acid Grid"
[variants.dark]
colors = { bg_base = "#020803", fg_base = "#f2f8ef", fg_muted = "#a6d998", accent = "#9dff00", border = "#3f8f1f", glow_color = "#00e5ff", bg_panel = { mode = "Gradient", color = "#07130a", gradient_from = "#081808", gradient_to = "#030a04", gradient_angle_deg = 165 }, bg_elevated = { mode = "Solid", color = "#0c1f0e" } }
background = { mode = { Gradient = { from = "#04120a", to = "#010502", angle_deg = 180 } } }
[variants.light]
colors = { bg_base = "#eef4ec", fg_base = "#16251a", fg_muted = "#537d45", accent = "#4a8f00", border = "#6a9e0e", glow_color = "#0e7490", bg_panel = { mode = "Gradient", color = "#fbfffb", gradient_from = "#ffffff", gradient_to = "#eff7ec", gradient_angle_deg = 165 }, bg_elevated = { mode = "Solid", color = "#e0ecdc" } }
background = { mode = { Gradient = { from = "#f0f6ee", to = "#e2ece0", angle_deg = 180 } } }

[[variants]]
name = "Cyan Overdrive"
[variants.dark]
colors = { bg_base = "#010409", fg_base = "#e8faff", fg_muted = "#7fd8ea", accent = "#00e5ff", border = "#1f7a9e", glow_color = "#ff2bd6", bg_panel = { mode = "Gradient", color = "#061423", gradient_from = "#071827", gradient_to = "#030a12", gradient_angle_deg = 165 }, bg_elevated = { mode = "Solid", color = "#0a1c30" } }
background = { mode = { Gradient = { from = "#031020", to = "#01040a", angle_deg = 180 } } }
[variants.light]
colors = { bg_base = "#e9f2f4", fg_base = "#0b2530", fg_muted = "#3d6b7a", accent = "#0779c2", border = "#0e6a9e", glow_color = "#c2077f", bg_panel = { mode = "Gradient", color = "#fbfeff", gradient_from = "#ffffff", gradient_to = "#eef7f8", gradient_angle_deg = 165 }, bg_elevated = { mode = "Solid", color = "#dcebee" } }
background = { mode = { Gradient = { from = "#eef6f7", to = "#dfeced", angle_deg = 180 } } }

[[variants]]
name = "Blade Amber"
[variants.dark]
colors = { bg_base = "#0a0502", fg_base = "#fff4e0", fg_muted = "#d8b284", accent = "#ffb300", border = "#9e6a1f", glow_color = "#ff3d5a", bg_panel = { mode = "Gradient", color = "#170e04", gradient_from = "#1c1105", gradient_to = "#0e0702", gradient_angle_deg = 165 }, bg_elevated = { mode = "Solid", color = "#221405" } }
background = { mode = { Gradient = { from = "#120a03", to = "#050201", angle_deg = 180 } } }
[variants.light]
colors = { bg_base = "#f4f0e9", fg_base = "#302008", fg_muted = "#7a6236", accent = "#b45309", border = "#9e7a0e", glow_color = "#b3123f", bg_panel = { mode = "Gradient", color = "#fffdf8", gradient_from = "#ffffff", gradient_to = "#f8f2e6", gradient_angle_deg = 165 }, bg_elevated = { mode = "Solid", color = "#eee4d2" } }
background = { mode = { Gradient = { from = "#f6f2ea", to = "#eae2d2", angle_deg = 180 } } }
