name = "Retro MMORPG"
description = "Quest board • guild notices • trading post"

preset_css = '''
/* ============================================================
   Retro MMORPG Preset
   Warm brown panels, ember-red controls, and gold text with
   chunky shadowing. The goal is an old fantasy-game UI feel
   without the dead black page backdrop.
   ============================================================ */

/* Global text shadow for that bitmap-font-engine look */
body, h1, h2, h3, h4, p, a, span, div, li {
  text-shadow: 1px 1px 0 color-mix(in srgb, var(--bg-base) 80%, var(--fg-base)) !important;
}

/* Remove the base theme's vignette/glow */
body::before {
  background: none !important;
  opacity: 0 !important;
}

/* Warm workspace gradient driven by editor palette */
html,
body {
  background-color: var(--bg-base) !important;
}

body {
  background-image:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--bg-panel) 55%, var(--bg-base)) 0%,
      var(--bg-base) 42%,
      color-mix(in srgb, var(--bg-base) 82%, var(--border-color)) 100%
    ),
    radial-gradient(
      circle at top center,
      color-mix(in srgb, var(--accent) 20%, transparent),
      transparent 48%
    ),
    radial-gradient(
      circle at bottom center,
      color-mix(in srgb, var(--border-color) 28%, transparent),
      transparent 55%
    ) !important;
  background-attachment: fixed !important;
}

/* CONTAINER surfaces */
.canvas-core,
.mor-post,
.mor-panel,
.main-header,
.mor-footer,
.mor-catalog-dropdown {
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--bg-panel) 72%, var(--accent)) 0%,
    var(--bg-panel) 100%
  ) !important;
  border: 2px solid var(--border-color) !important;
  border-radius: 4px !important;
  box-shadow:
    inset 1px 1px 0 color-mix(in srgb, var(--fg-base) 8%, transparent),
    inset -1px -1px 0 color-mix(in srgb, var(--bg-base) 55%, transparent) !important;
}

/* Make the header itself part of the brown surface instead of floating over black */
.main-header {
  margin-bottom: 0 !important;
  overflow: hidden !important;
}

.main-header,
.main-header .header-top-row,
.main-header .header-bottom-row {
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--bg-panel) 80%, var(--accent)) 0%,
    color-mix(in srgb, var(--bg-panel) 88%, var(--bg-base)) 100%
  ) !important;
}

.main-header .header-top-row {
  border-bottom: 2px solid var(--border-color) !important;
}

.main-header .header-bottom-row {
  border-top: 1px solid color-mix(in srgb, var(--fg-base) 6%, transparent) !important;
}

/* CONTENT surfaces inside containers */
.mor-panel .panel-content,
.canvas-core .panel-content {
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--bg-panel) 65%, var(--fg-base)) 0%,
    color-mix(in srgb, var(--bg-panel) 82%, var(--bg-base)) 100%
  ) !important;
  border: 2px solid var(--border-color) !important;
  border-radius: 2px !important;
  margin: 6px !important;
  padding: 12px !important;
  box-shadow: inset 2px 2px 5px color-mix(in srgb, var(--bg-base) 35%, transparent) !important;
}

/* Headings (gold/orange) */
h1, h2, h3, h4,
.main-header .institute-title,
.mor-post .post-title,
.mor-post .post-title a {
  color: var(--accent) !important;
  font-weight: bold !important;
  letter-spacing: 0.5px !important;
  text-shadow:
    1px 1px 0 color-mix(in srgb, var(--bg-base) 80%, var(--fg-base)),
    2px 2px 0 color-mix(in srgb, var(--bg-base) 45%, transparent) !important;
}

.main-header .branding-link,
.main-header .branding-link:hover,
.main-header .branding-link:focus-visible {
  color: var(--accent) !important;
}

.mor-post .post-title {
  border-bottom: 2px solid var(--border-color) !important;
  padding-bottom: 8px !important;
  margin-bottom: 12px !important;
}

/* Main navigation band */
.mor-nav a,
.mor-nav button {
  color: color-mix(in srgb, var(--fg-base) 78%, var(--accent)) !important;
}

.mor-nav > a:hover,
.mor-nav > a:focus-visible {
  background: color-mix(in srgb, var(--accent) 38%, var(--bg-base)) !important;
  color: var(--fg-base) !important;
}
/* Links */
.mor-post .post-body a,
.panel-content a {
  color: var(--accent) !important;
  text-decoration: underline !important;
}

.mor-post .post-body a:hover,
.panel-content a:hover {
  color: var(--fg-base) !important;
}

/* Panel headers */
.panel-header,
.mor-panel-heading {
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 70%, var(--bg-panel)) 0%,
    color-mix(in srgb, var(--accent) 46%, var(--bg-base)) 100%
  ) !important;
  color: var(--accent) !important;
  font-weight: bold !important;
  text-align: center !important;
  padding: 6px 10px !important;
  border-bottom: 2px solid var(--border-color) !important;
  border-radius: 2px 2px 0 0 !important;
  box-shadow: inset 1px 1px 0 color-mix(in srgb, var(--accent) 16%, transparent) !important;
}

/* Search / form fields */
input[type='text'],
input[type='search'],
input[type='email'],
textarea,
select {
  background: color-mix(in srgb, var(--bg-panel) 55%, var(--fg-base)) !important;
  color: var(--fg-base) !important;
  border: 2px solid var(--border-color) !important;
  border-radius: 0 !important;
  padding: 6px 8px !important;
  text-shadow: none !important;
  font-weight: bold !important;
}

input[type='text']:focus,
input[type='search']:focus,
input[type='email']:focus,
textarea:focus,
select:focus {
  outline: none !important;
  background: color-mix(in srgb, var(--bg-panel) 35%, var(--fg-base)) !important;
  border-color: var(--accent) !important;
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 14px !important;
}
::-webkit-scrollbar-track {
  background: color-mix(in srgb, var(--bg-panel) 80%, var(--bg-base)) !important;
  border-left: 2px solid var(--border-color) !important;
}
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 65%, var(--bg-base)) !important;
  border: 2px solid var(--border-color) !important;
  box-shadow: inset 1px 1px 0 color-mix(in srgb, var(--accent) 16%, transparent) !important;
}
::-webkit-scrollbar-thumb:hover {
  background: color-mix(in srgb, var(--accent) 78%, var(--bg-panel)) !important;
}

/* Header toggle compatibility */
.header-panel-toggle,
.header-top-row > .panel-toggle {
  min-width: 0 !important;
  width: 36px !important;
  height: 36px !important;
  min-height: 36px !important;
  padding: 0 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  white-space: normal !important;
  flex-shrink: 0 !important;
  color: transparent !important;
  overflow: hidden !important;
  position: relative !important;
}

.header-panel-toggle::before,
.header-top-row > .panel-toggle::before {
  content: "" !important;
  position: absolute !important;
  inset: 0 !important;
  display: block !important;
  background-color: color-mix(in srgb, var(--accent) 35%, var(--fg-base)) !important;
  background-image: none !important;
  opacity: 1 !important;
  transform: none !important;
  pointer-events: none !important;
}

.header-panel-toggle::after,
.header-top-row > .panel-toggle::after {
  content: none !important;
  display: none !important;
}

/* --- Theme cursors (default / pointer / text) --- */
body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M1 1L1 17L5 13L8 19L11 18L8 12L14 12Z' fill='%23e8b923' stroke='%233a2410' stroke-width='1'/></svg>") 1 1, auto !important; }
a, button { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M12 2l2 4v8h-4V6z M7 14h10v2H7z M11 16h2v5h-2z' fill='%23e8b923' stroke='%233a2410' stroke-width='1'/></svg>") 12 2, pointer !important; }
input, textarea { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 3h6M12 3v18M9 21h6' fill='none' stroke='%23e8b923' stroke-width='1.6'/></svg>") 12 12, text !important; }
'''

[colors]
bg_base = "#24170f"
fg_base = "#e7dcc0"
fg_muted = "#b8a88d"
accent = "#ffae42"
border = "#22160f"
panel_border_width = "1px"
glow_spread = "10px"
hover_scale = "1.02"

[colors.bg_panel]
mode = "Solid"
color = "#4f3b2a"

[colors.bg_elevated]
mode = "Solid"
color = "#5e4732"

[background.mode.Gradient]
from = "#362317"
to = "#1b120d"
angle_deg = 180

[typography]
body_font_stack = "Georgia, 'Times New Roman', Times, serif"
heading_font_stack = "Georgia, 'Times New Roman', Times, serif"
mono_font_stack = "'Courier New', Courier, monospace"
base_size = "16px"
scale_ratio = "1.2"
line_height = "1.5"
heading_weight = "700"

[buttons]
radius = "2px"
border_width = "2px"
text_transform = "none"
padding_x = "14px"
padding_y = "6px"
font_weight = "bold"
text_color = "var(--accent)"
fill = "gradient"
gradient_from = "color-mix(in srgb, var(--accent) 72%, var(--bg-panel))"
gradient_to = "color-mix(in srgb, var(--accent) 48%, var(--bg-base))"
gradient_angle = "180deg"
box_shadow = "inset 1px 1px 0 color-mix(in srgb, var(--accent) 18%, transparent), inset -1px -1px 0 color-mix(in srgb, var(--bg-base) 45%, transparent)"
hover_effect = "brighten"
pressed_feedback = true
transition_ms = "100ms"

[light.colors]
bg_base = "#f5e9d3"
fg_base = "#2c2118"
fg_muted = "#6b5c4a"
accent = "#8b5a00"
border = "#c8b8a0"
panel_border_width = "1px"
glow_spread = "10px"
hover_scale = "1.02"

[light.colors.bg_panel]
mode = "Solid"
color = "#f8f1e3"

[light.colors.bg_elevated]
mode = "Solid"
color = "#fffaf0"

[light.background.mode.Solid]
color = "#f5e9d3"

[scrollbars]
width = "14px"
track_color = "#2a1a0c"
thumb_color = "#e8b923"
thumb_hover_color = "#c0392b"
