name = "Web 1.0 Frames"
description = "Under Construction since 1998"

preset_css = '''
/* ============================================================
   Web 1.0 Frames preset
   The mid-1990s personal homepage: ridged grey panels, sharp
   corners, and "best viewed in Netscape" energy.
   ============================================================ */

/* Force chunky ridged borders on every major surface */
.canvas-core,
.mor-post,
.mor-panel,
.main-header,
.mor-footer,
.mor-pager,
.mor-catalog-dropdown,
.panel-header {
  border-style: ridge;
  border-width: 3px;
  border-color: var(--border-color);
  border-radius: 0;
  box-shadow: none;
}

.main-header {
  background: linear-gradient(
    90deg,
    color-mix(in srgb, var(--accent) 45%, var(--bg-base)) 0%,
    color-mix(in srgb, var(--accent) 25%, var(--bg-panel)) 100%
  ) !important;
  color: var(--fg-base) !important;
  padding: 0 !important;
  font-weight: 700;
  border-bottom: 2px solid color-mix(in srgb, var(--border-color) 55%, var(--bg-base));
}

.main-header .header-top-row,
.main-header .header-bottom-row {
  background: transparent !important;
  color: var(--fg-base) !important;
  border-color: color-mix(in srgb, var(--border-color) 55%, var(--bg-base)) !important;
}

.main-header .header-top-row {
  padding: 10px 20px 9px !important;
  border-bottom: 2px solid color-mix(in srgb, var(--border-color) 55%, var(--bg-base)) !important;
}

.main-header .header-bottom-row {
  padding: 6px 20px 8px !important;
  border-top: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border-color)) !important;
}

.main-header .institute-title {
  font-family: "MS Sans Serif", Tahoma, sans-serif;
  letter-spacing: 0;
}

.mor-post .post-title::before {
  content: "📝 ";
}

.mor-nav a {
  color: var(--fg-base) !important;
  text-decoration: underline;
}

.mor-nav a:hover {
  background: transparent !important;
  color: var(--accent) !important;
}

/* Buttons = classic 90s system buttons */
button,
.panel-toggle,
.pager-btn,
.mor-post button {
  background: color-mix(in srgb, var(--bg-panel) 70%, var(--fg-base)) !important;
  color: var(--fg-base) !important;
  border: 3px outset var(--border-color) !important;
  border-radius: 0 !important;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
}

button:active,
.panel-toggle:active,
.pager-btn:active,
.mor-post button:active {
  border-style: inset !important;
  background: var(--bg-panel) !important;
}

/* ============================================================
   FOOTER
   ============================================================ */
.mor-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 3px outset var(--border-color);
  border-bottom: 3px outset var(--border-color);
  font-size: 0.85rem;
  padding: 8px 12px;
  background: var(--bg-panel);
}

.mor-post .post-body a,
.panel-content a {
  color: var(--accent);
  text-decoration: underline;
}

.mor-post h1,
.mor-post h2,
.mor-post h3 {
  font-family: var(--font-heading);
  color: var(--fg-base);
  font-weight: 700;
}

/* Footer status-bar feel */
.mor-footer {
  background: var(--bg-panel);
  color: var(--fg-base);
  border-top: 2px solid color-mix(in srgb, var(--fg-base) 22%, var(--bg-panel));
  border-bottom: 2px solid color-mix(in srgb, var(--border-color) 75%, var(--bg-base));
  font-family: "MS Sans Serif", Tahoma, sans-serif;
  font-size: 0.85rem;
  padding: 4px 8px;
}

*,
*::before,
*::after {
  text-shadow: none;
}

.mor-post,
.mor-panel,
.canvas-core {
  box-shadow: none;
}

.mor-footer .footer-sys-info::after {
  content: " UNDER CONSTRUCTION";
  margin-left: 8px;
  animation: web1-blink 1.2s steps(2, end) infinite;
  color: color-mix(in srgb, var(--accent) 85%, var(--fg-base));
  font-weight: 700;
}

@keyframes web1-blink {
  50% {
    opacity: 0;
  }
}

.mor-search .prompt {
  display: none !important;
}

/* --- Theme cursors (default / pointer / text) --- */
body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M1 1L1 17L5 13L8 19L11 18L8 12L14 12Z' fill='%23c0c0c0' stroke='%23000000' stroke-width='1.6'/></svg>") 1 1, auto !important; }
a, button { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 2.2c-.7 0-1.3.6-1.3 1.3v6.5H6.9c-.6 0-1.1.3-1.4.8-.3.5-.2 1.1.1 1.6l2.2 3.1c.5.7 1.3 1.1 2.1 1.1h3.4c1 0 1.9-.7 2.1-1.7l.7-3.2c.2-.9-.3-1.8-1.2-2-.2 0-.3-.1-.5-.1h-2.8V3.5c0-.7-.6-1.3-1.3-1.3z' fill='%23c0c0c0' stroke='%23000000' stroke-width='1.6'/></svg>") 9 2, pointer !important; }
input, textarea { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 3h6M12 3v18M9 21h6' fill='none' stroke='%23000000' stroke-width='1.6'/></svg>") 12 12, text !important; }
'''

[colors]
bg_base = "#008080"
fg_base = "#000000"
fg_muted = "#404040"
accent = "#0000ee"
border = "#dfdfdf"
panel_border_width = "3px"
glow_spread = "0px"
hover_scale = "1.0"

[colors.bg_panel]
mode = "Solid"
color = "#c0c0c0"

[colors.bg_elevated]
mode = "Solid"
color = "#dfdfdf"

[background.mode.Tile]
url = "data:image/gif;base64,R0lGODlhEAAQALMAAAAAAP///wAAAAAAACH5BAEAAAIALAAAAAAQABAAAAQzUMhJq7046yq0/2DAzkUWDGNmhmRnXGWqrigLwzB8x1Hk370P7Pw+Hw+I4w2PxyNyuWw2EwEAOw=="

[typography]
body_font_stack = "\"Times New Roman\", Times, serif"
heading_font_stack = "\"Times New Roman\", Times, serif"
mono_font_stack = "\"Courier New\", Courier, monospace"
base_size = "16px"
scale_ratio = "1.15"
line_height = "1.45"
heading_weight = "700"

[buttons]
radius = "0px"
border_width = "3px"
text_transform = "none"

[dark.colors]
bg_base = "#1a1a2e"
fg_base = "#eaeaea"
fg_muted = "#a0a0a0"
accent = "#00aaff"
border = "#4a4a6a"
panel_border_width = "3px"
glow_spread = "0px"
hover_scale = "1.0"

[dark.colors.bg_panel]
mode = "Solid"
color = "#2a2a4a"

[dark.colors.bg_elevated]
mode = "Solid"
color = "#3a3a5a"

[dark.background.mode.Solid]
color = "#1a1a2e"

[scrollbars]
width = "16px"
track_color = "#dfdfdf"
thumb_color = "#808080"
thumb_hover_color = "#404040"
