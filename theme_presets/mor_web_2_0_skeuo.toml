name = "Web 2.0 Skeuomorphic"
description = "The 2006 startup landing page: glossy top-lit cards, a wet-floor reflection under the masthead, aqua pill navigation, sticker-badge labels, and letterpressed type — all floating over a fixed gradient sky."

preset_css = '''
/* ============================================================
   Web 2.0 Skeuomorphic
   Signatures: top-lit gloss on every surface, -webkit-box-reflect
   wet floor under the branding, aqua pill nav, sticker badges on
   labels, 1px letterpress text-shadow, polaroid images, speech
   bubble quotes. Everything routes through the theme variables so
   both palettes stay coherent.
   ============================================================ */

/* --- Sky ------------------------------------------------------ */
body {
  background-attachment: fixed !important;
}

::selection {
  background: color-mix(in srgb, var(--accent) 35%, transparent);
  text-shadow: none;
}

/* --- Glossy card surfaces ------------------------------------- */
.canvas-core,
.mor-post,
.mor-panel,
.main-header,
.mor-footer,
.mor-catalog-mega-dropdown,
.mor-bell-panel,
.mor-gm-panel {
  background: var(--bg-panel) !important;
  border: 1px solid var(--border-color) !important;
  border-radius: 14px !important;
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, #ffffff 30%, transparent),
    0 1px 2px color-mix(in srgb, var(--fg-base) 10%, transparent),
    0 10px 28px color-mix(in srgb, var(--fg-base) 14%, transparent) !important;
}

/* Inner content panes stay flat; the outer card does the lifting. */
.mor-panel .panel-content,
.canvas-core .panel-content {
  background: transparent !important;
  border: none !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  margin: 0 !important;
}

/* Glossy band across every panel header. */
.panel-header {
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--bg-elevated) 55%, #ffffff) 0%,
    var(--bg-elevated) 48%,
    color-mix(in srgb, var(--bg-elevated) 92%, #000000) 100%
  ) !important;
  color: var(--fg-base) !important;
  font-weight: 700 !important;
  padding: 9px 14px !important;
  border-bottom: 1px solid var(--border-color) !important;
  border-radius: 13px 13px 0 0 !important;
  text-shadow: 0 1px 0 color-mix(in srgb, var(--bg-base) 75%, #ffffff) !important;
}

/* --- Masthead: gloss sweep + wet-floor branding ---------------- */
.main-header {
  position: relative !important;
  overflow: visible !important;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--bg-panel) 60%, #ffffff) 0%,
    var(--bg-panel) 50%,
    color-mix(in srgb, var(--bg-panel) 90%, var(--accent)) 100%
  ) !important;
}

/* Top-half glass shine, the honest 2006 way. */
.main-header::after {
  content: "";
  position: absolute;
  inset: 0 0 50% 0;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, #ffffff 28%, transparent) 0%,
    color-mix(in srgb, #ffffff 3%, transparent) 100%
  );
  border-radius: 13px 13px 40% 40% / 13px 13px 18px 18px;
  pointer-events: none;
}

/* The wet floor. Degrades to nothing outside WebKit — that is fine. */
.branding,
.mor-header-brand .branding-link {
  font-family: var(--font-heading) !important;
  font-weight: 700 !important;
  letter-spacing: -0.5px !important;
  color: var(--fg-base) !important;
  text-shadow: 0 1px 0 color-mix(in srgb, var(--bg-base) 75%, #ffffff) !important;
  -webkit-box-reflect: below -6px linear-gradient(
    transparent 62%,
    color-mix(in srgb, var(--fg-base) 22%, transparent) 100%
  );
}

/* --- Aqua pill navigation -------------------------------------- */
.mor-nav a,
.mor-nav .catalog-toggle {
  border-radius: 999px !important;
  padding: 5px 14px !important;
  font-weight: 600 !important;
  color: var(--fg-base) !important;
  text-shadow: 0 1px 0 color-mix(in srgb, var(--bg-base) 75%, #ffffff) !important;
  text-decoration: none !important;
  transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease;
}

.mor-nav a:hover,
.mor-nav a:focus-visible {
  color: #ffffff !important;
  text-shadow: 0 -1px 0 color-mix(in srgb, #000000 25%, transparent) !important;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 72%, #ffffff) 0%,
    var(--accent) 52%,
    color-mix(in srgb, var(--accent) 70%, #000000) 100%
  ) !important;
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, #ffffff 30%, transparent),
    0 1px 3px color-mix(in srgb, var(--fg-base) 25%, transparent) !important;
}

/* --- Type & links ----------------------------------------------- */
h1, h2, h3, h4,
.post-title,
.post-title a {
  color: var(--fg-base) !important;
  letter-spacing: -0.4px !important;
  text-shadow: 0 1px 0 color-mix(in srgb, var(--bg-base) 75%, #ffffff) !important;
}

/* Gradient hairline under post titles — the 2006 divider. */
.mor-post .post-title {
  padding-bottom: 10px !important;
  margin-bottom: 14px !important;
  border-bottom: none !important;
  background:
    linear-gradient(90deg, var(--border-color), transparent 85%)
    bottom left / 100% 1px no-repeat;
}

.post-body a,
.panel-content a,
.comments a {
  color: var(--accent) !important;
  text-decoration: none !important;
  border-bottom: 1px dotted color-mix(in srgb, var(--accent) 55%, transparent);
  transition: border-color 120ms ease, color 120ms ease;
}

.post-body a:hover,
.panel-content a:hover,
.comments a:hover {
  color: color-mix(in srgb, var(--accent) 80%, var(--fg-base)) !important;
  border-bottom: 1px solid var(--accent);
}

hr {
  border: none !important;
  height: 2px !important;
  margin: 1.6em auto !important;
  background: linear-gradient(90deg, transparent, var(--border-color), transparent) !important;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--bg-base) 70%, #ffffff) !important;
}

/* Meta lines whisper. */
.byline,
.post-meta,
.post-timestamp,
.footer-copyright {
  color: var(--fg-muted) !important;
  text-shadow: 0 1px 0 color-mix(in srgb, var(--bg-base) 70%, #ffffff) !important;
}

/* --- Sticker badges: labels & tags ------------------------------ */
.post-labels a,
.post-tags a,
.minimal-tag {
  display: inline-block;
  padding: 2px 11px !important;
  border-radius: 999px !important;
  font-size: 0.82em !important;
  font-weight: 600 !important;
  color: var(--accent) !important;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent) !important;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 8%, var(--bg-elevated)) 0%,
    color-mix(in srgb, var(--accent) 20%, var(--bg-elevated)) 100%
  ) !important;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 28%, transparent) !important;
  text-shadow: none !important;
  text-decoration: none !important;
}

.post-labels a:hover,
.post-tags a:hover {
  border-color: var(--accent) !important;
  filter: brightness(1.06);
}

/* --- Polaroid images -------------------------------------------- */
.post-body img,
.post-thumbnail img {
  background: var(--bg-elevated);
  padding: 6px;
  border: 1px solid var(--border-color) !important;
  border-radius: 8px !important;
  box-shadow:
    0 1px 2px color-mix(in srgb, var(--fg-base) 12%, transparent),
    0 6px 16px color-mix(in srgb, var(--fg-base) 14%, transparent) !important;
}

/* --- Speech-bubble blockquote ------------------------------------ */
.post-body blockquote {
  position: relative;
  margin: 1.4em 0.4em !important;
  padding: 14px 18px 14px 52px !important;
  border: 1px solid var(--border-color) !important;
  border-left: none !important;
  border-radius: 14px !important;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 6%, var(--bg-elevated)),
    color-mix(in srgb, var(--accent) 12%, var(--bg-elevated))
  ) !important;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 25%, transparent) !important;
  font-style: italic;
}

.post-body blockquote::before {
  content: "\201C";
  position: absolute;
  left: 12px;
  top: 0px;
  font-family: var(--font-heading);
  font-size: 3em;
  line-height: 1.2;
  color: color-mix(in srgb, var(--accent) 60%, transparent);
  text-shadow: 0 1px 0 color-mix(in srgb, var(--bg-base) 70%, #ffffff);
}

/* --- Code: the inset terminal chip ------------------------------- */
.post-body code {
  font-family: var(--font-mono) !important;
  font-size: 0.9em;
  background: color-mix(in srgb, var(--fg-base) 7%, var(--bg-elevated)) !important;
  border: 1px solid var(--border-color) !important;
  border-radius: 6px !important;
  padding: 1px 6px !important;
}

.post-body pre {
  background: color-mix(in srgb, var(--fg-base) 7%, var(--bg-elevated)) !important;
  border: 1px solid var(--border-color) !important;
  border-radius: 10px !important;
  padding: 14px 16px !important;
  box-shadow: inset 0 2px 5px color-mix(in srgb, var(--fg-base) 10%, transparent) !important;
}

/* --- Beta-form inputs -------------------------------------------- */
input[type='text'],
input[type='search'],
input[type='email'],
.gtk-search-input,
.mor-search input,
textarea,
select {
  background: var(--bg-elevated) !important;
  color: var(--fg-base) !important;
  border: 1px solid var(--border-color) !important;
  border-top-color: color-mix(in srgb, var(--border-color) 65%, #000000) !important;
  border-radius: 999px !important;
  padding: 6px 14px !important;
  box-shadow: inset 0 2px 4px color-mix(in srgb, var(--fg-base) 8%, transparent) !important;
  text-shadow: none !important;
  transition: border-color 140ms ease, box-shadow 140ms ease;
}

textarea {
  border-radius: 14px !important;
}

input[type='text']:focus,
input[type='search']:focus,
input[type='email']:focus,
.gtk-search-input:focus,
.mor-search input:focus,
textarea:focus,
select:focus {
  outline: none !important;
  border-color: var(--accent) !important;
  box-shadow:
    inset 0 2px 4px color-mix(in srgb, var(--fg-base) 8%, transparent),
    0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent) !important;
}

/* --- Comment bubbles ---------------------------------------------- */
.comment-block {
  background: var(--bg-elevated) !important;
  border: 1px solid var(--border-color) !important;
  border-radius: 12px !important;
  box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 25%, transparent) !important;
}

/* --- Footer: the glossy basement strip ----------------------------- */
.mor-footer {
  background: linear-gradient(
    180deg,
    var(--bg-panel) 0%,
    color-mix(in srgb, var(--bg-panel) 82%, var(--accent)) 100%
  ) !important;
  padding: 16px 22px !important;
  margin-top: 20px !important;
}

/* --- Theme cursors: the glossy arrow set ---------------------------- */
body { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M1 1L1 17L5 13L8 19L11 18L8 12L14 12Z' fill='%231e87d6' stroke='%23ffffff' stroke-width='1.4'/></svg>") 1 1, auto !important; }
a, button { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 2.2c-.7 0-1.3.6-1.3 1.3v6.5H6.9c-.6 0-1.1.3-1.4.8-.3.5-.2 1.1.1 1.6l2.2 3.1c.5.7 1.3 1.1 2.1 1.1h3.4c1 0 1.9-.7 2.1-1.7l.7-3.2c.2-.9-.3-1.8-1.2-2-.2 0-.3-.1-.5-.1h-2.8V3.5c0-.7-.6-1.3-1.3-1.3z' fill='%231e87d6' stroke='%23ffffff' stroke-width='1.4'/></svg>") 9 2, pointer !important; }
input, textarea { cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M9 3h6M12 3v18M9 21h6' fill='none' stroke='%231e87d6' stroke-width='1.6'/></svg>") 12 12, text !important; }
'''

# Base palette = light mode (this theme is a daylight-first design).
[colors]
bg_base = "#cfe2f3"
fg_base = "#1d3349"
fg_muted = "#5b7288"
accent = "#1e87d6"
border = "#a5c1da"
panel_border_width = "1px"
glow_spread = "10px"
hover_scale = "1.02"

[colors.bg_panel]
mode = "Gradient"
color = "#ffffff"
gradient_from = "#ffffff"
gradient_to = "#e7f0f9"
gradient_angle_deg = 180

[colors.bg_elevated]
mode = "Gradient"
color = "#f6fafe"
gradient_from = "#f6fafe"
gradient_to = "#dce9f5"
gradient_angle_deg = 180

[background.mode.Gradient]
from = "#fdfeff"
to = "#8db8e0"
angle_deg = 180

[typography]
body_font_stack = "'Open Sans', 'Lucida Grande', 'Segoe UI', Verdana, sans-serif"
heading_font_stack = "'Poppins', 'Trebuchet MS', 'Lucida Grande', sans-serif"
mono_font_stack = "'Inconsolata', 'Courier New', monospace"
base_size = "16px"
scale_ratio = "1.24"
line_height = "1.6"
heading_weight = "700"

# The glossy fill IS the Web 2.0 button: top-lit accent gradient,
# white text, inset shine. Buttons live here, never in preset_css.
[buttons]
radius = "18px"
border_width = "1px"
border_style = "solid"
padding_x = "18px"
padding_y = "7px"
text_transform = "none"
font_weight = "600"
letter_spacing = "0.2px"
fill = "glossy"
hover_effect = "brighten"
pressed_feedback = true
transition_ms = "140ms"
easing = "ease-out"
focus_ring_color = "color-mix(in srgb, var(--accent) 45%, transparent)"
focus_ring_width = "3px"

[light.colors]
bg_base = "#cfe2f3"
fg_base = "#1d3349"
fg_muted = "#5b7288"
accent = "#1e87d6"
border = "#a5c1da"
panel_border_width = "1px"
glow_spread = "10px"
hover_scale = "1.02"

[light.colors.bg_panel]
mode = "Gradient"
color = "#ffffff"
gradient_from = "#ffffff"
gradient_to = "#e7f0f9"
gradient_angle_deg = 180

[light.colors.bg_elevated]
mode = "Gradient"
color = "#f6fafe"
gradient_from = "#f6fafe"
gradient_to = "#dce9f5"
gradient_angle_deg = 180

[light.background.mode.Gradient]
from = "#fdfeff"
to = "#8db8e0"
angle_deg = 180

# Dark = the 2007 "dashboard at midnight": deep slate blue, the gloss
# survives as cooler, dimmer highlights; accent brightens for contrast.
[dark.colors]
bg_base = "#0f1b2a"
fg_base = "#dcebf8"
fg_muted = "#8ba4bd"
accent = "#4fb0ef"
border = "#31506e"
panel_border_width = "1px"
glow_spread = "10px"
hover_scale = "1.02"

[dark.colors.bg_panel]
mode = "Gradient"
color = "#1c2d42"
gradient_from = "#1f3149"
gradient_to = "#15222f"
gradient_angle_deg = 180

[dark.colors.bg_elevated]
mode = "Gradient"
color = "#243750"
gradient_from = "#293e59"
gradient_to = "#1c2c40"
gradient_angle_deg = 180

[dark.background.mode.Gradient]
from = "#16273c"
to = "#080e18"
angle_deg = 180

[scrollbars]
width = "14px"
track_color = "color-mix(in srgb, var(--bg-base) 75%, var(--fg-base))"
thumb_color = "#4aa3e0"
thumb_hover_color = "#2a8ad0"
