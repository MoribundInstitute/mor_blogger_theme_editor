# --- Color variants: other districts, same paper --------------------------
# Each edition moves stock, ink, and lamplight together, not just the accent.

[[variants]]
name = "Verdigris"
[variants.light]
colors = { bg_base = "#dce6dd", fg_base = "#142320", fg_muted = "#4e6a5f", accent = "#0f6b57", border = "#a8c2b3", bg_panel = { mode = "Solid", color = "#e9f0e8" }, bg_elevated = { mode = "Solid", color = "#f1f6ee" } }
background = { mode = { Solid = { color = "#dce6dd" } } }
[variants.dark]
colors = { bg_base = "#0c1f1a", fg_base = "#d8e6da", fg_muted = "#8aa695", accent = "#4fb397", border = "#27443a", bg_panel = { mode = "Solid", color = "#122a24" }, bg_elevated = { mode = "Solid", color = "#16332c" } }
background = { mode = { Solid = { color = "#0c1f1a" } } }

[[variants]]
name = "Incinerate"
[variants.light]
colors = { bg_base = "#e3d6c4", fg_base = "#241812", fg_muted = "#6f5544", accent = "#a32b20", border = "#cbac90", bg_panel = { mode = "Solid", color = "#f0e5d3" }, bg_elevated = { mode = "Solid", color = "#f5ecdc" } }
